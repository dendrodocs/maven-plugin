summary:
  goals:
    text: "Generate local intermediary JSON during Maven builds with reliable failure."
    sources:
      - docs/arc42/01-introduction-and-goals.adoc
  constraints:
    text: "Public DendroDocs repo, MIT, Maven Central, JDK21+, Maven3.9.11+, Java-default UTF-8 Java21 sources; selectable standalone tools own other language validation."
    sources:
      - docs/arc42/02-architecture-constraints.adoc
  context:
    text: "Maven supplies roots and dependencies; analyzer produces schema-validated per-root JSON."
    sources:
      - docs/arc42/03-context-and-scope.adoc
  strategy:
    text: "Resolve selected standalone analyzer with Java default, conditional Java preflight and declaration checks, isolate process, stage and merge output."
    sources:
      - docs/arc42/04-solution-strategy.adoc
  building_blocks:
    text: "GenerateMojo, AnalyzerProcess, Maven Resolver, JDK compiler, Jackson, external analyzer."
    sources:
      - docs/arc42/05-building-block-view.adoc
  runtime:
    text: "Skip POMs, normalize roots, adapt class directories, validate, analyze, merge, replace, cleanup."
    sources:
      - docs/arc42/06-runtime-view.adoc
  deployment:
    text: "Plugin in Maven, analyzer in child JVM; Windows/Linux Maven 3.9.11 and 3.10.0 CI with PR-read-only caches and summaries; compiled-adapter CodeQL with fork SARIF; uncached manual Central staging."
    sources:
      - docs/arc42/07-deployment-view.adoc
  cross_cutting:
    text: "Per-module workspaces, no analyzer classes in Maven realm, schema owned upstream."
    sources:
      - docs/arc42/08-crosscutting-concepts.adoc
  decisions:
    text: "ADR001 isolation and ADR002 reliable generation are proposed; ADR003 tool selection is draft; all implemented for review."
    sources:
      - docs/arc42/09-architectural-decisions.adoc
  quality:
    text: "Executable coverage of errors, reactors, roots, paths, timeout, and offline reuse; Spotless formatting, JaCoCo unit-test reports, CI evidence summaries, and compiled-adapter CodeQL."
    sources:
      - docs/arc42/10-quality-requirements.adoc
  risks:
    text: "OSV matches in four analyzer components block releases; reachability and large-project timings unknown."
    sources:
      - docs/arc42/11-risks-and-technical-debt.adoc
  glossary:
    text: "Mojo, reactor, intermediary JSON, source root, standalone analyzer, schema, class directory, fresh output."
    sources:
      - docs/arc42/12-glossary.adoc
