name: Stage Maven Central release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already committed in pom.xml
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: maven-central-release
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'dendrodocs/maven-plugin' && github.ref == 'refs/heads/main'
    environment: maven-central
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          pom_version=$(./mvnw -q org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)
          test "$pom_version" = "$RELEASE_VERSION"
      - name: Verify release
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Enforce analyzer advisory gate
        shell: pwsh
        run: ./scripts/Audit-Analyzer.ps1 -FailOnFindings
      - name: Configure signing and Central credentials
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Stage signed bundle for Central review
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease -Dinvoker.skip=true deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Summarize release verification
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/Write-CiSummary.ps1
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-staging-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/site/jacoco/
            target/surefire-reports/*.xml
            target/invoker-reports/*.xml
            target/security/*.json
            target/central-publishing/*
